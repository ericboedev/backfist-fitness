  <title>Backfist Fitness</title>
  <style>
    :root {
      --bg:#fafaf9;--bg2:#f0efed;--bg3:#fff;
      --text:#1c1c1c;--text2:#666;--text3:#aaa;
      --border:#e8e8e6;--border2:#d0d0ce;
      --r:14px;--rs:10px;
      --sb:env(safe-area-inset-bottom,0px);
      --st:env(safe-area-inset-top,0px);
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#161616;--bg2:#222;--bg3:#1e1e1e;--text:#f0f0ee;--text2:#888;--text3:#555;--border:#2a2a2a;--border2:#333;}
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none;}
    input,select,textarea,button{font-family:inherit;}
    #app{display:flex;flex-direction:column;height:100dvh;}
    .hdr{padding:calc(var(--st) + 16px) 20px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .hdr-eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;}
    .hdr-title{font-size:24px;font-weight:700;margin-top:2px;}
    .add-btn{background:var(--text);color:var(--bg);border:none;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;}
    .tabs{display:flex;gap:4px;margin:14px 20px 0;background:var(--bg2);border-radius:12px;padding:4px;flex-shrink:0;}
    .tab{flex:1;padding:9px 0;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s;}
    .tab.active{background:var(--bg3);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08);}
    .scroll{flex:1;overflow-y:auto;padding:14px 20px;padding-bottom:max(80px,calc(var(--sb) + 20px));-webkit-overflow-scrolling:touch;}
    .card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;margin-bottom:9px;}
    .card.tap{cursor:pointer;}.card.tap:active{opacity:.8;}
    .card-title{font-size:15px;font-weight:600;}
    .card-sub{font-size:12px;color:var(--text2);margin-top:3px;}
    .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
    .tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:8px;}
    .t-push{background:#fff7ed;color:#c2410c;}
    .t-pull{background:#eff6ff;color:#1d4ed8;}
    .t-legs{background:#f0fdf4;color:#15803d;}
    .t-core{background:#fef2f2;color:#b91c1c;}
    .t-bjj{background:#faf5ff;color:#7c3aed;}.t-hyrox{background:#fff7ed;color:#c2410c;}
    .t-neu{background:var(--bg2);color:var(--text2);}
    .t-beg{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
    .t-fc{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;}
    .t-mc{background:#faf5ff;color:#6b21a8;border:1px solid #e9d5ff;}
    .t-cc{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;}
    @media(prefers-color-scheme:dark){
      .t-push{background:#2d1a0a;color:#fb923c;}
      .t-pull{background:#0d1f3c;color:#60a5fa;}
      .t-legs{background:#0d2d1a;color:#4ade80;}
      .t-core{background:#2d0d0d;color:#f87171;}
      .t-bjj{background:#1e0d3c;color:#c084fc;}.t-hyrox{background:#2d1a0a;color:#fb923c;}
      .t-beg{background:#0d2d1a;color:#4ade80;border-color:#166534;}
      .t-fc{background:#0d1f3c;color:#60a5fa;border-color:#1d4ed8;}
      .t-mc{background:#1e0d3c;color:#c084fc;border-color:#6b21a8;}
      .t-cc{background:#2d1a0a;color:#fb923c;border-color:#9a3412;}
    }
    .empty{text-align:center;padding:60px 0;color:var(--text3);}
    .empty-icon{font-size:42px;margin-bottom:12px;}
    .empty-title{font-size:15px;font-weight:600;color:var(--text2);}
    .empty-sub{font-size:13px;margin-top:4px;}
    .search{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;background:var(--bg3);color:var(--text);outline:none;margin-bottom:12px;}
    .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
    .chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
    .chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
    .ex-actions{display:flex;gap:5px;flex-shrink:0;margin-left:8px;}
    .icon-btn{padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text2);font-size:12px;cursor:pointer;}
    .icon-btn.del{border-color:#fee2e2;color:#ef4444;}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:200;}
    .sheet{background:var(--bg3);border-radius:20px 20px 0 0;padding:24px 20px;padding-bottom:max(32px,var(--sb));width:100%;max-height:92dvh;overflow-y:auto;}
    .handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px;}
    .s-title{font-size:19px;font-weight:700;margin-bottom:20px;}
    .field{margin-bottom:14px;}
    .flabel{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
    .inp{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--rs);font-size:14px;background:var(--bg);color:var(--text);outline:none;}
    .inp:focus{border-color:var(--border2);}
    textarea.inp{resize:none;}
    .feel-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
    .feel-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;}
    .feel-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
    .mactions{display:flex;gap:10px;margin-top:20px;}
    .btn-s{flex:2;padding:14px;border-radius:12px;border:none;background:var(--text);color:var(--bg);font-size:15px;font-weight:700;cursor:pointer;}
    .btn-c{flex:1;padding:14px;border-radius:12px;border:1px solid var(--border);background:none;color:var(--text2);font-size:15px;cursor:pointer;}
    .btn-d{flex:1;padding:14px;border-radius:12px;border:1px solid #fee2e2;background:none;color:#ef4444;font-size:15px;cursor:pointer;}
    .lex-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:10px;margin-bottom:6px;}
    .lex-name{flex:1;font-size:13px;font-weight:500;}
    .sinp{width:38px;text-align:center;border:1px solid var(--border);border-radius:6px;padding:5px 4px;font-size:12px;background:var(--bg3);color:var(--text);}
    .slabel{font-size:11px;color:var(--text3);}
    .rm-btn{border:none;background:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0 2px;line-height:1;}
    .lib-label{font-size:12px;font-weight:600;color:var(--text2);margin:12px 0 7px;}
    .lib-chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
    .lib-chips::-webkit-scrollbar{display:none;}
    .lib-chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;}
    .vrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
    .vrow:last-child{border-bottom:none;}
  </style>
</head>

function startPlanWorkout(encoded){
  const d = JSON.parse(decodeURIComponent(encoded));
  // Match plan exercise names to library exercises
  const matched = [];
  d.exercises.forEach(function(exName){
    // Strip superset notation like "1. X → Y" — extract both parts
    const parts = exName.replace(/^\d+\.\s*/,'').split(' → ');
    parts.forEach(function(part){
      const name = part.trim();
      const found = S.exercises.find(function(e){
        return e.name.toLowerCase().includes(name.toLowerCase()) ||
               name.toLowerCase().includes(e.name.toLowerCase());
      });
      if(found && !matched.find(function(m){return m.id===found.id;})){
        matched.push({id:found.id,name:found.name,sets:found.default_sets,reps:found.default_reps});
      } else if(!found) {
        // Add as custom entry even if not in library
        matched.push({id:'plan_'+Date.now()+'_'+Math.random(),name:name,sets:3,reps:'10'});
      }
    });
  });
  // Determine session type from focus
  const typeMap = {'Push':'Push','Pull':'Pull','Legs':'Legs','Core':'Core',
    'Push / Pull':'Push / Pull','Legs / Core':'Legs / Core','Full':'Full Body','Circuit':'Full Body','BJJ':'BJJ / MMA'};
  const lType = typeMap[d.focus] || 'Full Body';
  ss({
    tab:'log',
    modal:'newLog',
    lDate:new Date().toISOString().slice(0,10),
    lDuration:'30',
    lType:lType,
    lExs:matched,
    lNotes:'',
    lFeel:'Good'
  });
}

function handleAdd(){if(S.tab==="log")ss({modal:"newLog",lDate:new Date().toISOString().slice(0,10),lDuration:"30",lType:"Push / Pull",lExs:[],lNotes:"",lFeel:"Good"});else if(S.tab==="exercises")ss({modal:"addEx",editEx:null,fName:"",fCat:"Push",fLevel:"First Class",fSets:"3",fReps:"10",fNotes:""});}
function openEditEx(id){const ex=S.exercises.find(e=>e.id===id);if(!ex)return;ss({modal:"editEx",editEx:ex,fName:ex.name,fCat:ex.category,fLevel:ex.level,fSets:String(ex.default_sets),fReps:ex.default_reps,fNotes:ex.notes||""});}
function saveEx(){const{fName,fCat,fLevel,fSets,fReps,fNotes,editEx:ee,exercises}=S;if(!fName.trim())return;const entry={id:ee?.id||"c"+Date.now(),name:fName.trim(),category:fCat,level:fLevel,default_sets:parseInt(fSets)||3,default_reps:fReps,notes:fNotes,custom:true};const u=ee?exercises.map(e=>e.id===ee.id?entry:e):[...exercises,entry];save("bf2_ex",u);ss({exercises:u,modal:null});}
function delEx(id){if(!confirm("Remove?"))return;const u=S.exercises.filter(e=>e.id!==id);save("bf2_ex",u);ss({exercises:u});}
function openViewLog(id){const l=S.logs.find(x=>x.id===id);if(l)ss({modal:"view",viewLog:l});}
function addLex(id){const ex=S.exercises.find(e=>e.id===id);if(!ex)return;ss({lExs:[...S.lExs,{id:ex.id,name:ex.name,sets:ex.default_sets,reps:ex.default_reps}]});}
function rmLex(i){ss({lExs:S.lExs.filter((_,idx)=>idx!==i)});}
function updLex(i,f,v){ss({lExs:S.lExs.map((e,idx)=>idx===i?{...e,[f]:v}:e)});}
function saveLog(){const{lDate,lDuration,lType,lExs,lNotes,lFeel,logs}=S;const entry={id:"l"+Date.now(),date:lDate,duration:parseInt(lDuration)||30,type:lType,exercises:lExs,notes:lNotes,feeling:lFeel};const u=[entry,...logs];save("bf2_logs",u);ss({logs:u,modal:null});}
function delLog(id){if(!confirm("Delete workout?"))return;const u=S.logs.filter(l=>l.id!==id);save("bf2_logs",u);ss({logs:u,modal:null});}

const FOCUS_COLOR = {
  "Push":"t-push","Pull":"t-pull","Legs":"t-legs","Core":"t-core",
  "Push / Pull":"t-push","Legs / Core":"t-legs","Full":"t-bjj","Circuit":"t-bjj"

function renderPlan(){
  const{activeProgram,planLevel}=S;
  let html="<div class=\"scroll\">";
  html+="<div style=\"display:flex;gap:6px;margin-bottom:14px\">";
  html+="<button class=\"chip "+(activeProgram==="YAYOG"?"active":"")+"\" onclick=\"ss({activeProgram:'YAYOG'})\">YAYOG</button>";
  html+="<button class=\"chip "+(activeProgram==="HYROX"?"active":"")+"\" onclick=\"ss({activeProgram:'HYROX'})\">Hyrox</button>";
  html+="</div>";
  if(activeProgram==="HYROX"){
    html+="<div style=\"background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--text2)\">";
    html+="<strong style=\"color:var(--text)\">8-week Hyrox prep</strong> by Luke Storath (first Hyrox World Champion). 3–5 sessions/week. Start 8 weeks before your race.<br><br>";
    html+="<strong style=\"color:var(--text)\">RPE:</strong> 1=easy · 4-6=moderate · 7-8=intense · 9=very hard · 10=max<br>";
    html+="<strong style=\"color:var(--text)\">WK-Tempo</strong> = your target race pace (min/km)";
    html+="</div>";
    HYROX_PROGRAM.weeks.forEach(function(w){
      html+="<div style=\"margin-bottom:20px\">";
      html+="<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">";
      html+="<div style=\"font-size:13px;font-weight:700;color:var(--text)\">"+w.range+"</div>";
      html+="<div style=\"font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--bg2);color:var(--text2)\">"+w.block+"</div>";
      html+="</div>";
      html+="<div style=\"font-size:12px;color:var(--text2);margin-bottom:10px;padding:8px 12px;background:var(--bg2);border-radius:10px;line-height:1.5\">";
      html+="<strong style=\"color:var(--text)\">Structure:</strong> "+w.method;
      html+="</div>";
      w.days.forEach(function(d){
        var isRace=d.label.includes("RACE")||d.label.includes("Little");
        var isRest=d.label.includes("Wed");
        html+="<div class=\"card\" style=\"margin-bottom:7px\">";
        html+="<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\">";
        html+="<div style=\"display:flex;align-items:center;gap:8px\">";
        html+="<span style=\"font-size:13px;font-weight:700\">"+d.label+"</span>";
        html+="<span class=\"tag t-bjj\">"+d.focus+"</span>";
        html+="</div>";
        if(!isRest&&!d.label.includes("RACE DAY"))html+="<button onclick=\"startPlanWorkout('"+encodeURIComponent(JSON.stringify(d))+"')\" style=\"padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--text);color:var(--bg);font-size:11px;font-weight:600;cursor:pointer\">Start</button>";
        html+="</div>";
        html+="<div style=\"display:flex;flex-direction:column;gap:4px\">";
        d.exercises.forEach(function(e){html+="<div style=\"font-size:13px;color:var(--text2);padding-left:4px;line-height:1.5\">"+e+"</div>";});
        html+="</div></div>";
      });
      html+="</div>";
    });
  } else {
    const prog=PROGRAMS[planLevel||"Basis"];
    const levels=Object.keys(PROGRAMS);
    html+="<div style=\"display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px\">";
    levels.forEach(function(l){html+="<button class=\"chip "+(planLevel===l?"active":"")+"\" onclick=\"ss({planLevel:'"+l+"'})\">"+l+"</button>";});
    html+="</div>";
    html+="<div style=\"background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--text2)\">";
    html+="<strong style=\"color:var(--text)\">10-week program</strong> &middot; 4–5 days/week &middot; 20–30 min/session.<br>Complete one full cycle, rest 1–2 weeks, then repeat at a harder level.";
    html+="</div>";
    prog.weeks.forEach(function(w){
      html+="<div style=\"margin-bottom:20px\">";
      html+="<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">";
      html+="<div style=\"font-size:13px;font-weight:700;color:var(--text)\">"+w.range+"</div>";
      html+="<div style=\"font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--bg2);color:var(--text2)\">"+w.block+"</div>";
      html+="</div>";
      html+="<div style=\"font-size:12px;color:var(--text2);margin-bottom:10px;padding:8px 12px;background:var(--bg2);border-radius:10px;line-height:1.5\">";
      html+="<strong style=\"color:var(--text)\">Method:</strong> "+(METHOD_EXPLAINERS[w.method]||w.method);
      html+="</div>";
      w.days.forEach(function(d){
        html+="<div class=\"card\" style=\"margin-bottom:7px\">";
        html+="<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\">";
        html+="<div style=\"display:flex;align-items:center;gap:8px\">";
        html+="<span style=\"font-size:13px;font-weight:700\">"+d.label+"</span>";
        html+="<span class=\"tag "+(FOCUS_COLOR[d.focus]||"t-neu")+"\" >"+d.focus+"</span>";
        html+="</div>";
        html+="<button onclick=\"startPlanWorkout('"+encodeURIComponent(JSON.stringify(d))+"')\" style=\"padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--text);color:var(--bg);font-size:11px;font-weight:600;cursor:pointer\">Start</button>";
        html+="</div>";
        html+="<div style=\"display:flex;flex-direction:column;gap:4px\">";
        d.exercises.forEach(function(e){html+="<div style=\"font-size:13px;color:var(--text2);padding-left:4px;line-height:1.4\">"+e+"</div>";});
        html+="</div></div>";
      });
      html+="</div>";
    });
  }
  html+="</div>";
  return html;
}


if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script>
